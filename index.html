<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0B1A">
<title>Нейм-рулетка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css?v=20261025d">
</head>
<body>
<canvas id="fx"></canvas>
<div id="vig" aria-hidden="true"></div>
<div class="app">
  <header>
    <div class="brand">
      <button class="prof-btn" id="prof-btn" aria-label="Профиль" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button>
      <h1>Нейм-рулетка</h1>
    </div>
    <div class="top"><div class="pill" id="coins"></div><button class="bon-btn" id="bon-btn" aria-label="Бонусы" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M8 8a2.5 2.5 0 1 1 0-5c2 0 4 2.5 4 5 0-2.5 2-5 4-5a2.5 2.5 0 1 1 0 5"/></svg><i class="dot" hidden></i></button></div>
  </header>

  <section id="tab-game">
    <div id="reels"></div>
    <div class="hint" id="idle">Крути, чтобы выбить юзернейм</div>
    <div class="seg" id="seg" role="group" aria-label="Режим"></div>
    <div class="seg two" id="cnt" role="group" aria-label="Сколько открыть"></div>
    <button class="spin" id="spin"></button>
    <div class="stats"><span id="st-spins"></span><span id="st-best"></span></div>
  </section>

  <section id="tab-col" class="list" hidden></section>
  <section id="tab-up" class="list" hidden></section>
  <section id="tab-prof" class="prof" hidden></section>
  <section id="tab-bon" class="list bon" hidden></section>
  <section id="tab-ach" class="list ach-page" hidden></section>
</div>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/><circle cx="12" cy="12" r="1.2"/></svg><span>Рулетка</span></button>
  <button role="tab" aria-selected="false" data-tab="col"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Коллекция</span></button>
  <button role="tab" aria-selected="false" data-tab="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V6M6 12l6-6 6 6"/><path d="M5 20h14"/></svg><span>Апгрейд</span></button>
</nav>
<div class="selbar" id="selbar"><span id="selinfo"></span><button class="btn main sm" id="selsell">Продать</button></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/app.js?v=20261025d"></script>
</body>
</html>
