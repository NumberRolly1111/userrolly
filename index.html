<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1FF">
<title>Нейм-рулетка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
  <header><h1>Нейм-рулетка</h1><div class="top"><button class="bonus" id="bonus" hidden>+50 🪙 бонус дня</button><div class="pill" id="coins"></div></div></header>

  <section id="tab-game">
    <div class="stage" id="stage">
      <div class="reel" id="reel" aria-live="polite"></div>
      <div id="idle" class="hint">Крутани, чтобы выбить юзернейм</div>
      <div id="res" hidden>
        <div class="badge"><i></i><span id="tier"></span></div>
        <div class="tags" id="tags"></div>
        <div class="acts">
          <button class="btn main" id="keep">Забрать в коллекцию</button>
          <button class="btn" id="sell"></button>
          <button class="btn" id="check">Проверить в Telegram</button>
          <button class="btn" id="copy">Копировать</button>
          <button class="btn wide" id="share">Поделиться</button>
        </div>
      </div>
    </div>
    <div class="seg" id="seg" role="group" aria-label="Режим"></div>
    <div class="odds" id="odds" aria-label="Шансы выпадения"></div>
    <button class="spin" id="spin"></button>
    <div class="stats"><span id="st-spins"></span><span id="st-best"></span></div>
  </section>

  <section id="tab-col" class="list" hidden></section>
  <section id="tab-up" class="list" hidden></section>
</div>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="game">Рулетка</button>
  <button role="tab" aria-selected="false" data-tab="col">Коллекция</button>
  <button role="tab" aria-selected="false" data-tab="up">Апгрейд</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="js/app.js"></script>
</body>
</html>
